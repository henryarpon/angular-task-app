<app-header />

<main>
    <ul id="users">
        @for (user of users; track user.id) {
            <li>
                <app-user [user]="user" (userSelect)="onSelectUser($event)" />
            </li>
        }
    </ul>
    <div>
        <app-task [user]="selectedUser()?.name" />
    </div>
</main>
