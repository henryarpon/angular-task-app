<section>
    <header>
        <h2>{{ user().name }}'s Tasks</h2>
        <menu>
            <button>Add Task</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTask(); track task.id) {
            <li>
                <app-task [task]="task" />
            </li>
        }
    </ul>
</section>
